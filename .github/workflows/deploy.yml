
name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spring-boot-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Test
        run: ./mvnw -B clean verify

      - name: Deploy Application JAR
        run: |
          install -m 0644 \
            target/devops-assignment-api-0.0.1-SNAPSHOT.jar \
            /opt/devops-assignment-api/app.jar

      - name: Restart Spring Boot Service
        run: |
          sudo -n /usr/bin/systemctl restart devops-assignment-api.service

      - name: Verify Application Health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1/actuator/health; then
              echo
              echo "Deployment successful!"
              exit 0
            fi
            echo "Waiting for application to start..."
            sleep 2
          done

          echo "Application health check failed!"
          sudo /usr/bin/systemctl status devops-assignment-api.service --no-pager
          exit 1
